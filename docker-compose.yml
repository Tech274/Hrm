services:
  postgres:
    image: postgres:16-alpine
    container_name: hireflow-postgres
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow_secret
      POSTGRES_DB: hireflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hireflow:hireflow_secret@postgres:5432/hireflow
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hireflow-frontend
    environment:
      VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
