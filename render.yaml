# Render Blueprint: connect this repo and deploy to create Postgres + backend in one go.
# Dashboard: New → Blueprint → Connect repo → select this repo.

databases:
  - name: skillhub-db
    plan: free
    databaseName: hireflow

services:
  - type: web
    runtime: node
    name: skillhub-backend
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillhub-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
